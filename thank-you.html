<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root { --navy: #1c1a4a; --brand: #3e3c8a; --red: #c8202f; --cream: #f7f4ee; --muted: #5d5b77; --line: #e4e1ee; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', system-ui, sans-serif; color: #16152e; background: var(--cream);
      min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
    }
    header { background: #fff; border-bottom: 1px solid var(--line); }
    header .wrap { height: 72px; display: flex; align-items: center; }
    header img { height: 48px; width: auto; }
    .wrap { width: 100%; max-width: 1160px; margin: 0 auto; padding: 0 20px; }
    main { flex: 1; display: grid; place-items: center; padding: 60px 20px; }
    .box { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 48px 36px; max-width: 560px; text-align: center; box-shadow: 0 30px 60px -30px rgba(28,26,74,.3); }
    .check { width: 72px; height: 72px; border-radius: 50%; background: #fbe9eb; color: var(--red); display: grid; place-items: center; margin: 0 auto 24px; }
    .check svg { width: 36px; height: 36px; }
    h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(30px, 5vw, 40px); line-height: 1.1; margin-bottom: 14px; }
    p { color: var(--muted); font-size: 17px; line-height: 1.6; margin-bottom: 28px; }
    .call { display: inline-flex; align-items: center; gap: 10px; background: var(--navy); color: #fff; font-weight: 800; text-decoration: none; padding: 15px 26px; border-radius: 12px; }
    .call:hover { background: var(--brand); }
    .call svg { width: 18px; height: 18px; }
    .back { display: block; margin-top: 20px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a href="https://www.liquorlawsa.co.za/"><img src="img/logo.png" alt="Vincent Bergh Liquor Law &amp; Business Consulting" width="280" height="90" /></a>
    </div>

  <main>
    <div class="box">
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
